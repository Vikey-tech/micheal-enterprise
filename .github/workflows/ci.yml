name: MVP checks
on:
  push:
    branches: [main, feat/dealership-mvp]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dealership_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/dealership_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tools -v
      - run: go test -race -count=1 ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: test -z "$(gofmt -l .)"
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      OWNER_NAME: Test Owner
      OWNER_EMAIL: owner@example.test
      OWNER_PASSWORD: ci-owner-password-only
      MANAGER_NAME: Test Manager
      MANAGER_EMAIL: manager@example.test
      MANAGER_PASSWORD: ci-manager-password-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: docker compose run --rm --no-deps -e OWNER_NAME -e OWNER_EMAIL -e OWNER_PASSWORD -e MANAGER_NAME -e MANAGER_EMAIL -e MANAGER_PASSWORD api /app/setup
      - name: Setup must refuse a second run
        run: |
          if docker compose run --rm --no-deps -e OWNER_NAME -e OWNER_EMAIL -e OWNER_PASSWORD -e MANAGER_NAME -e MANAGER_EMAIL -e MANAGER_PASSWORD api /app/setup; then
            echo "Repeated administrator setup unexpectedly succeeded"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node tests/production-smoke.mjs
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
