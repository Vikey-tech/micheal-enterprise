services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: micheal
      POSTGRES_USER: micheal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U micheal -d micheal]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://micheal:${POSTGRES_PASSWORD}@db:5432/micheal?sslmode=disable
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
      IMAGE_OPTIMIZER: /app/tools/optimize_images.py
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    init: true
    depends_on: [api]
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [api, web]
volumes:
  postgres_data:
  uploads:
